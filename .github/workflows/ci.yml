name: CI
on:
  push:
    branches: [master, main]
  pull_request:
jobs:
  web:
    name: FreeToken (lint · types · tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
  desktop:
    name: V-Run (types · all test suites)
    # the agent runs commands in PowerShell and the tests drive Chrome: Windows, like V-Run's users
    runs-on: windows-latest
    timeout-minutes: 40
    defaults: { run: { working-directory: desktop } }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22, cache: npm, cache-dependency-path: desktop/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
        env: { VRUN_TEST_LIMIT_MS: '600000' }
